name: Android and original safety
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - name: Independent AES recovery dependency
        run: python -m pip install -r requirements-recovery.txt
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '12266719'
          log-accepted-android-sdk-licenses: false
      - name: SDK baseline
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: JVM tests, APK and lint
        run: bash gradlew test :app:assembleDebug :app:lintDebug --console=plain
      - name: Independent offline original recovery
        run: python scripts/test_pos_fixtures.py
      - name: Independent AES container recovery
        run: python scripts/test_pos2_fixtures.py
      - uses: actions/upload-artifact@v4
        with:
          name: ciel-vitrine-debug
          path: app/build/outputs/apk/debug/app-debug.apk
