name: Android and original safety
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Independent AES recovery dependency
        run: python -m pip install -r requirements-recovery.txt
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          cmdline-tools-version: '12266719'
          log-accepted-android-sdk-licenses: false
      - name: SDK baseline
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: JVM tests, APK and lint
        run: bash gradlew test :app:assembleDebug :app:lintDebug --console=plain
      - name: Independent offline original recovery
        run: python scripts/test_pos_fixtures.py
      - name: Independent AES container recovery
        run: python scripts/test_pos2_fixtures.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: validation-reports
          retention-days: 7
          path: |
            **/build/test-results/**/*.xml
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ciel-vitrine-debug
          retention-days: 7
          path: app/build/outputs/apk/debug/app-debug.apk
  android-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          cmdline-tools-version: '12266719'
          log-accepted-android-sdk-licenses: false
      - name: Compile SDK baseline
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Free unused SDK toolchains on the disposable runner
        shell: bash
        run: |
          for toolchain in "$ANDROID_HOME"/ndk/*; do
            version="${toolchain##*/}"
            if [[ -d "$toolchain" && "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "$version" != "28.2.13676358" ]]; then
              sdkmanager --uninstall "ndk;$version"
            fi
          done
          df -h .
      - name: Generate private test media
        run: |
          python -m pip install -r requirements-safety.txt
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python scripts/prepare-safety-corpus.py
      - name: Prepare pinned public JPEGs
        shell: pwsh
        run: ./scripts/prepare-photo-corpus.ps1
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android API 35 safety and viewer tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          disable-animations: true
          script: bash gradlew :app:connectedDebugAndroidTest --console=plain
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-safety-reports
          retention-days: 7
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
          if-no-files-found: ignore
